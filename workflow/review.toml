# The shared wrapper admits automatic reviews only for associated authors,
# preventing outsiders from consuming the shared agent budget.
hosts = ["github.com"]
repos = ["cgwalters-forge/misctool"]
bases = ["main"]
max_outputs = 11
max_patch_bytes = 1024
max_patch_files = 1

[github.outputs]
add_comment = { max = 1 }
noop = { max = 1 }
# Inline findings beside the verdict (cgwalters-review.yml), held to the pull request.
create_pull_request_review_comment = { max = 10 }

[github.trigger]
events = ["pull_request_target", "pull_request"]
roles = ["all"]
bots = ["dependabot[bot]"]
forks = true
